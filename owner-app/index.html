<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171713">
  <title>철원민통선한과 운영관리</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="shell">
  <section class="panel login" id="login-panel">
    <p class="eyebrow">OWNER APP</p>
    <h1>운영자 로그인</h1>
    <form id="login-form">
      <div class="field"><label>이메일</label><input id="email" type="email" required></div>
      <div class="field"><label>비밀번호</label><input id="password" type="password" required></div>
      <button class="primary">로그인</button>
      <p id="login-msg" class="message error"></p>
    </form>
  </section>

  <section id="dashboard" hidden>
    <div class="topbar">
      <div><p class="eyebrow">OWNER</p><h1>철원민통선한과 운영관리</h1></div>
      <button id="logout" class="secondary">로그아웃</button>
    </div>

    <div class="install-banner" id="install-banner" hidden>
      <span>갤럭시에서는 홈 화면에 설치해 앱처럼 사용할 수 있습니다.</span>
      <button id="install-btn" class="primary">앱 설치</button>
    </div>

    <section class="panel">
      <div class="panel-head"><h2>오늘 현황</h2><button id="refresh-all" class="ghost">새로고침</button></div>
      <div class="metrics" id="metrics"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>예약판매 관리</h2></div>
      <form id="settings-form">
        <div class="grid">
          <div class="field full"><label>예약판매명</label><input id="sale-title" required></div>
          <div class="field"><label>예약 시작일</label><input id="sale-start" type="date" required></div>
          <div class="field"><label>예약 종료일</label><input id="sale-end" type="date" required></div>
          <div class="field full"><label>홈페이지 중요 안내</label><textarea id="site-notice"></textarea></div>
          <div class="field"><label>배송비</label><input id="shipping-fee" type="number" min="0"></div>
          <div class="field"><label>무료배송 기준금액(0=없음)</label><input id="free-shipping" type="number" min="0"></div>
          <div class="field"><label>은행</label><input id="bank-name"></div>
          <div class="field"><label>계좌번호</label><input id="account-number"></div>
          <div class="field"><label>예금주</label><input id="account-holder"></div>
          <div class="field"><label>문의 전화번호</label><input id="store-phone"></div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">설정 저장</button>
          <button class="danger" type="button" id="force-close">예약판매 즉시 종료</button>
          <button class="ghost" type="button" id="reopen-sale">즉시종료 해제</button>
        </div>
        <p id="settings-msg" class="message"></p>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>상품·재고 관리</h2><button id="add-product" class="ghost">상품 추가</button></div>
      <div id="product-list"></div>
      <div class="actions"><button id="save-products" class="primary">상품 저장</button></div>
      <p id="product-msg" class="message"></p>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>공지 관리</h2><button id="add-notice" class="ghost">공지 추가</button></div>
      <p class="helper">공개한 공지는 고객 홈페이지 상단 예약판매 상태 바로 아래에 표시됩니다. 고정 공지는 먼저 표시됩니다.</p>
      <div id="notice-list"></div>
      <div class="actions"><button id="save-notices" class="primary">공지 저장</button></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>주문 관리</h2><button id="csv-export" class="ghost">CSV 다운로드</button></div>
      <div class="filters">
        <input id="order-search" placeholder="주문번호 / 이름 / 전화번호">
        <select id="receive-filter">
          <option value="all">전체 수령방법</option><option value="delivery">배송</option><option value="pickup">픽업</option>
        </select>
        <select id="status-filter">
          <option value="all">전체 상태</option>
          <option value="new">주문접수</option><option value="paid">입금확인</option><option value="preparing">상품준비중</option>
          <option value="shipping">배송중</option><option value="delivered">배송완료</option>
          <option value="ready_for_pickup">픽업준비완료</option><option value="picked_up">수령완료</option><option value="cancelled">취소</option>
        </select>
        <select id="payment-filter">
          <option value="all">전체 결제</option><option value="unpaid">미입금</option><option value="paid">입금확인</option>
          <option value="refund_pending">환불대기</option><option value="refunded">환불완료</option>
        </select>
      </div>
      <div id="order-list" class="order-list"></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
