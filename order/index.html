<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>철원민통선한과 유지보수</title><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><section class="panel login" id="login-panel"><p class="eyebrow">MAINTENANCE</p><h1>유지보수 로그인</h1><form id="login-form"><div class="field"><label>이메일</label><input id="email" type="email" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" required></div><button class="primary">로그인</button><p id="login-msg" class="message error"></p></form></section><section id="dashboard" hidden><div class="topbar"><div><p class="eyebrow">MAINTENANCE</p><h1>시스템 점검</h1></div><button id="logout" class="secondary">로그아웃</button></div><section class="panel"><div class="panel-head"><h2>연결 상태</h2><button id="run-check" class="ghost">다시 점검</button></div><div class="metrics" id="diagnostics"></div></section><section class="panel"><h2>현재 설정</h2><div class="grid" id="settings-view"></div></section><section class="panel"><h2>최근 알림/오류 로그</h2><div id="notification-log"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script src="maintenance.js"></script></body></html>
